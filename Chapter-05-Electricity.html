function renderAll(){document.getElementById('questionList').innerHTML=questions.map((q,i)=>{let opts=q.opts.map((o,k)=>`<button class="option" id="q${i}o${k}" onclick="choose(${i},${k})"><span class="n">(${k+1})</span><span>${esc(o)}</span></button>`).join('');if(q.image_options)opts=q.image_options.map((src,k)=>`<button class="option" id="q${i}o${k}" onclick="choose(${i},${k})"><span class="n">(${k+1})</span><img src="${src}" alt="விருப்பம் ${k+1}"></button>`).join('')+`<button class="option" id="q${i}o3" onclick="choose(${i},3)"><span class="n">(4)</span><span>அனைத்தும்</span></button>`;return `<article class="card question-card" id="q${i}"><div class="qhead"><span>வினா ${i+1} / 54</span><span>NMMS PRACTICE</span></div><h2>${esc(q.stem)}</h2>${q.image?`<img src="${q.image}" style="display:block;max-width:100%;height:auto;max-height:220px;margin:10px auto;object-fit:contain">`:''}${opts}<div class="feedback" id="fb${i}"></div><div class="actions"><button class="secondary" onclick="readQuestion(${i})">🔊 வினாவைக் கேட்க</button></div></article>`}).join('')}

const praiseGood=['அருமை! உங்கள் முயற்சி வெற்றியாகிறது! 🌟','சிறப்பான பதில்! இப்படியே தொடருங்கள்! 🎉','வாவ்! உங்கள் அறிவு வளர்கிறது! 🏆','மிக நன்று! தொடர்ந்து முன்னேறுங்கள்! 💪'];

function choose(i,k){
 if(answers[i]!==undefined)return;
 answers[i]=k;let c=answerKey[i]-1,ok=k===c;if(ok)score++;
 for(let j=0;j<4;j++){let b=document.getElementById(`q${i}o${j}`);b.disabled=true;if(j===c)b.classList.add('correct');if(j===k&&!ok)b.classList.add('wrong')}
 let f=document.getElementById('fb'+i);
 f.className='feedback show '+(ok?'good':'bad');
 f.innerHTML=(ok?'✓ சரியான விடை! ':'✗ சரியான விடை: ('+(c+1)+') '+esc(questions[i].opts[c]||'படம் '+(c+1))+'<br>')+
 `<div class="motivation">${ok?praiseGood[i%praiseGood.length]:praiseTry[i%praiseTry.length]}</div>`;
 let n=Object.keys(answers).length;document.getElementById('score').textContent=score;document.getElementById('done').textContent=n+' / 54';document.getElementById('progress').style.width=(n/54*100)+'%';
 if(ok)launchConfetti();
 if(n===54)setTimeout(showResult,900);
}
function launchConfetti(){
 const canvas=document.getElementById('celebrateCanvas'),ctx=canvas.getContext('2d');
 canvas.width=innerWidth;canvas.height=innerHeight;
 const bits=Array.from({length:95},()=>({x:Math.random()*canvas.width,y:-20-Math.random()*canvas.height*.3,
 size:4+Math.random()*6,vx:(Math.random()-.5)*4,vy:2+Math.random()*5,rot:Math.random()*6,vr:(Math.random()-.5)*.2,
 color:['#ff4757','#ffa502','#2ed573','#1e90ff','#a55eea'][Math.floor(Math.random()*5)]}));
 let frame=0;
 function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);bits.forEach(b=>{b.x+=b.vx;b.y+=b.vy;b.rot+=b.vr;ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.rot);ctx.fillStyle=b.color;ctx.fillRect(-b.size/2,-b.size/2,b.size,b.size*1.7);ctx.restore()});frame++;if(frame<85)requestAnimationFrame(draw);else ctx.clearRect(0,0,canvas.width,canvas.height)}
 draw();
}
function showResult(){
 document.getElementById('result').classList.remove('hidden');
 let p=Math.round(score/54*100),done=Object.keys(answers).length,wrong=done-score,skip=54-done;

 document.getElementById('studentSummary').textContent=document.getElementById('student').value+' • VIII வகுப்பு • மின்னியல்';
 document.getElementById('counts').textContent='சரி: '+score+' | தவறு: '+wrong+' | விடுபட்டவை: '+skip+' | மதிப்பெண்: '+p+'%';
 let rows=questions.map((q,i)=>{let a=answers[i],c=answerKey[i]-1,status=a===undefined?'விடுபட்டது':a===c?'சரி':'தவறு';
 return `<tr><td>${i+1}</td><td>${esc(q.stem)}</td><td>${a===undefined?'—':'('+ (a+1)+') '+esc(q.opts[a]||'படம்')}</td><td>(${c+1}) ${esc(q.opts[c]||'படம்')}</td><td>${status}</td></tr>`}).join('');
 document.getElementById('reportDetails').innerHTML=`<h3>மாணவர் செயல்திறன் அறிக்கை</h3><p>பெயர்: ${esc(document.getElementById('student').value)} | வகுப்பு: VIII | பாடம்: மின்னியல்</p><table class="report-table"><thead><tr><th>வினா</th><th>வினா விவரம்</th><th>மாணவர் விடை</th><th>சரியான விடை</th><th>நிலை</th></tr></thead><tbody>${rows}</tbody></table>`;
 launchConfetti();document.getElementById('result').scrollIntoView({behavior:'smooth'});
}
async function downloadPDFReport(){
 const btn=document.getElementById('downloadReportBtn');
 const report=document.getElementById('result');
 if(!report || report.classList.contains('hidden')){alert('முதலில் வினாடி வினாவை முடிக்கவும்.');return;}
 if(typeof html2pdf==='undefined'){
   alert('PDF பதிவிறக்க வசதி ஏற்றப்படவில்லை. இணைய இணைப்பைச் சரிபார்த்து மீண்டும் முயற்சிக்கவும்.');
   return;
 }
 const oldText=btn.textContent;btn.disabled=true;btn.textContent='PDF தயாராகிறது...';
 try{
   const student=(document.getElementById('student').value||'Student').trim().replace(/[^\w\u0B80-\u0BFF-]+/g,'_');
   const opt={
     margin:[8,8,10,8],
     filename:`NMMS_VIII_Electricity_Report_${student}.pdf`,
     image:{type:'jpeg',quality:0.96},
     html2canvas:{scale:1.5,useCORS:true,backgroundColor:'#ffffff',scrollY:0},
     jsPDF:{unit:'mm',format:'a4',orientation:'landscape'},
     pagebreak:{mode:['css','legacy'],avoid:['tr']}
   };
   await html2pdf().set(opt).from(report).save();
   btn.textContent='✓ PDF பதிவிறக்கம் செய்யப்பட்டது';
   setTimeout(()=>{btn.textContent=oldText;btn.disabled=false;},2200);
 }catch(err){
   console.error(err);alert('PDF உருவாக்க முடியவில்லை. மீண்டும் முயற்சிக்கவும்.');
   btn.textContent=oldText;btn.disabled=false;
 }
}
function readQuestion(i){let q=questions[i],t=q.stem+' . '+q.opts.join(' . ');if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='ta-IN';u.rate=.8;speechSynthesis.speak(u)}}
function esc(x){return String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
</script>
<script id="nmms-navigation-upgrade">
(function(){
 let currentQuestion=0;
 const totalQuestions=questions.length;
 function navMarkup(){return `<div class="nmms-nav" id="nmmsNav"><button type="button" class="nmms-prev" id="nmmsPrev" onclick="nmmsPrevious()">← முந்தைய வினா</button><div class="nmms-counter" id="nmmsCounter">வினா 1 / ${totalQuestions}</div><button type="button" class="nmms-next" id="nmmsNext" onclick="nmmsNext()">அடுத்த வினா →</button></div>`}
 function updateNav(){
  const cards=document.querySelectorAll('#questionList .question-card');
  cards.forEach((card,i)=>card.classList.toggle('nmms-active',i===currentQuestion));
  const prev=document.getElementById('nmmsPrev'),next=document.getElementById('nmmsNext'),counter=document.getElementById('nmmsCounter');
  if(!prev||!next||!counter)return;
  prev.disabled=currentQuestion===0;
  counter.textContent=`வினா ${currentQuestion+1} / ${totalQuestions}  •  பதிலளித்தவை ${Object.keys(answers).length}`;
  next.textContent=currentQuestion===totalQuestions-1?'முடிக்கவும் ✓':'அடுத்த வினா →';
  document.getElementById('questionList').scrollIntoView({behavior:'smooth',block:'start'});
 }
 function initialize(){
  const list=document.getElementById('questionList');
  if(!document.getElementById('nmmsNav'))list.insertAdjacentHTML('afterend',navMarkup());
  currentQuestion=0;updateNav();
 }
 window.nmmsPrevious=function(){if(currentQuestion>0){currentQuestion--;updateNav();}};
 window.nmmsNext=function(){
  if(currentQuestion<totalQuestions-1){currentQuestion++;updateNav();return;}
  const unanswered=totalQuestions-Object.keys(answers).length;
  if(unanswered>0&&!confirm(`${unanswered} வினாக்களுக்கு இன்னும் பதிலளிக்கவில்லை. இப்போது முடிவைப் பார்க்க விரும்புகிறீர்களா?`))return;
  showResult();
 };
 window.choose=function(i,k){
  if(answers[i]!==undefined)return;
  answers[i]=k;
  const correctIndex=answerKey[i]-1, isCorrect=k===correctIndex;
  if(isCorrect)score++;
  for(let j=0;j<4;j++){
   const button=document.getElementById(`q${i}o${j}`);
   if(!button)continue;
   button.disabled=true;
   if(j===correctIndex)button.classList.add('correct');
   if(j===k&&!isCorrect)button.classList.add('wrong');
  }
  const correctText=(questions[i].opts&&questions[i].opts[correctIndex])||`படம் ${correctIndex+1}`;
  const feedback=document.getElementById('fb'+i);
  feedback.className='feedback show '+(isCorrect?'good':'bad');
  feedback.innerHTML=(isCorrect?'✓ சரியான விடை! ':'✗ சரியான விடை: ')+`(${correctIndex+1}) ${esc(correctText)}<div class="nmms-feedback-note">இந்த விடையையும் கருத்தையும் நிதானமாகப் படித்துப் புரிந்துகொள்ளுங்கள். தயாரானதும் “அடுத்த வினா” பொத்தானை அழுத்தவும்.</div>`;
  const answered=Object.keys(answers).length,wrong=answered-score;
  const scoreEl=document.getElementById('score');if(scoreEl)scoreEl.textContent=score;
  const doneEl=document.getElementById('done');if(doneEl)doneEl.textContent=answered+' / '+totalQuestions;
  const progress=document.getElementById('progress');if(progress)progress.style.width=(answered/totalQuestions*100)+'%';
  if(isCorrect&&typeof launchConfetti==='function')launchConfetti();
  updateNav();
 };
 const originalStart=window.startQuiz;
 window.startQuiz=function(){originalStart();initialize();};
})();
</script>
